[project]
name = "bergbahn-mcp"
version = "0.1.0"
description = "Demo-MCP-Server: Bahnen, Lifte, Pisten und Zugverbindungen"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
bergbahn-mcp = "bergbahn_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bergbahn_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
